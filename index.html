<!-- Scripts de Firebase con manejo seguro de imágenes -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAPAI1gTljTiynlWgGa-hOALMtCnjCUFOo",
            authDomain: "bonmuscomlistado1.firebaseapp.com",
            projectId: "bonmuscomlistado1",
            storageBucket: "bonmuscomlistado1.firebasestorage.app",
            messagingSenderId: "137381243576",
            appId: "1:137381243576:web:85c2890572a1228501a24d",
            measurementId: "G-24NSYJ0K50"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db);

        const totalAvisos = 10;
        const contenedor = document.getElementById('grillaAvisos');

        const imagenesBase64 = {};

        for (let i = 1; i <= totalAvisos; i++) {
            const numStr = i < 10 ? '0' + i : i;
            contenedor.innerHTML += `
                <div class="tarjeta-aviso" id="tarjeta-${i}">
                    <h3>
                        <span>Destacado N° ${numStr}</span>
                        <span id="hash-${i}" style="font-size:0.6rem; color:#7c4e31;">HASH: --------</span>
                    </h3>
                    <div class="meta-aviso" id="meta-${i}">Actualizado: --/--/---- --:-- hs</div>
                    
                    <div id="form-edit-${i}">
                        <div class="subida-foto-container">
                            <label for="file-${i}">📷 Seleccionar Imagen:</label><br>
                            <input type="file" id="file-${i}" accept="image/*" style="font-size:0.65rem; width:100%; margin-top:3px;">
                        </div>
                        <input type="text" id="titulo-${i}" class="campo-input" placeholder="Título / Comercio">
                        <textarea id="texto-${i}" class="campo-textarea" placeholder="Descripción, teléfono y datos..."></textarea>
                        <button class="btn btn-guardar" id="btn-g-${i}">💾 Guardar Casillero</button>
                    </div>

                    <div id="vista-fija-${i}" style="display: none;">
                        <div class="contenido-fijo">
                            <img id="fijo-img-${i}" class="foto-fija-preview" src="" alt="Imagen del aviso" style="display:none;">
                            <div class="titulo-fijo" id="fijo-titulo-${i}"></div>
                            <div class="texto-fijo" id="fijo-texto-${i}"></div>
                        </div>
                        <button class="btn btn-editar" id="btn-e-${i}">✏️ Modificar Aviso</button>
                    </div>
                </div>
            `;
        }

        window.fijarCasillero = function(id, titulo, texto, imagenUrl, hashId, fechado) {
            document.getElementById(`fijo-titulo-${id}`).innerText = titulo;
            document.getElementById(`fijo-texto-${id}`).innerText = texto;
            
            const imgElement = document.getElementById(`fijo-img-${id}`);
            if (imagenUrl && imagenUrl.length > 50) {
                imgElement.src = imagenUrl;
                imgElement.style.display = 'block';
            } else {
                imgElement.style.display = 'none';
            }

            if (hashId) document.getElementById(`hash-${id}`).innerText = 'HASH: ' + hashId;
            if (fechado) document.getElementById(`meta-${id}`).innerText = 'Actualizado: ' + fechado;

            document.getElementById(`form-edit-${id}`).style.display = 'none';
            document.getElementById(`vista-fija-${id}`).style.display = 'block';
        };

        window.habilitarEdicion = function(id) {
            const tituloActual = document.getElementById(`fijo-titulo-${id}`).innerText;
            const textoActual = document.getElementById(`fijo-texto-${id}`).innerText;

            document.getElementById(`titulo-${id}`).value = tituloActual;
            document.getElementById(`texto-${id}`).value = textoActual;

            document.getElementById(`vista-fija-${id}`).style.display = 'none';
            document.getElementById(`form-edit-${id}`).style.display = 'block';
        };

        for (let i = 1; i <= totalAvisos; i++) {
            const inputArchivo = document.getElementById(`file-${i}`);
            inputArchivo.addEventListener('change', function(e) {
                const archivo = e.target.files[0];
                if (archivo) {
                    const lector = new FileReader();
                    lector.onload = function(evento) {
                        imagenesBase64[i] = evento.target.result;
                    };
                    lector.readAsDataURL(archivo);
                }
            });

            document.getElementById(`btn-g-${i}`).addEventListener('click', () => {
                const titulo = document.getElementById(`titulo-${i}`).value.trim();
                const texto = document.getElementById(`texto-${i}`).value.trim();

                if (!titulo || !texto) {
                    alert("Completá el título y la descripción para fijar el aviso.");
                    return;
                }

                let imagenAguardar = imagenesBase64[i];
                if (!imagenAguardar) {
                    const imagenPrevia = document.getElementById(`fijo-img-${i}`).src;
                    if (imagenPrevia && imagenPrevia.startsWith('data:image')) {
                        imagenAguardar = imagenPrevia;
                    } else {
                        imagenAguardar = "";
                    }
                }

                const ahora = new Date();
                const fechado = ahora.toLocaleDateString('es-AR') + ' ' + ahora.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
                const hashId = 'FOTO-' + Math.random().toString(36).substring(2, 8).toUpperCase();

                const avisoRef = ref(db, 'bonuscom_clasificados_fotos_10/aviso_' + i);
                set(avisoRef, {
                    titulo,
                    texto,
                    imagen: imagenAguardar,
                    fechado,
                    hashId
                }).then(() => {
                    fijarCasillero(i, titulo, texto, imagenAguardar, hashId, fechado);
                }).catch((error) => {
                    alert('Error al guardar en Firebase: ' + error.message);
                });
            });

            document.getElementById(`btn-e-${i}`).addEventListener('click', () => {
                habilitarEdicion(i);
            });
        }

        get(child(dbRef, 'bonuscom_clasificados_fotos_10')).then((snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                for (let i = 1; i <= totalAvisos; i++) {
                    const item = data['aviso_' + i];
                    if (item && item.titulo && item.texto) {
                        fijarCasillero(i, item.titulo, item.texto, item.imagen || "", item.hashId, item.fechado);
                    }
                }
            }
        }).catch((error) => {
            console.error("Error al cargar datos:", error);
        });
    </script>
