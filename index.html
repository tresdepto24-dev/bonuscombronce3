<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonuscom Guía — Grilla de 10 Avisos (VentaniYA MDP)</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Courier Prime', monospace;
            background-color: #2b1d11;
            color: #2c1810;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .contenedor-guia {
            width: 100%;
            max-width: 800px;
            background: #f4ebd0;
            border: 4px solid #4a2e18;
            padding: 25px;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
            border-radius: 4px;
            box-sizing: border-box;
        }
        .encabezado {
            border-bottom: 3px double #4a2e18;
            padding-bottom: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        .encabezado h1 {
            font-family: 'Special Elite', cursive;
            font-size: 2rem;
            margin: 0;
            color: #2c1810;
        }
        .encabezado p {
            font-size: 0.8rem;
            color: #7c4e31;
            margin: 5px 0 0 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .grilla-avisos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 15px;
        }
        .tarjeta-aviso {
            background: #faedcd;
            border: 2px dashed #bc6c25;
            padding: 15px;
            border-radius: 4px;
            position: relative;
        }
        .tarjeta-aviso h3 {
            font-family: 'Special Elite', cursive;
            margin-top: 0;
            color: #bc6c25;
            font-size: 1.1rem;
            border-bottom: 1px dashed #bc6c25;
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .meta-aviso {
            font-size: 0.7rem;
            color: #5c3a21;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .campo-input, .campo-textarea {
            width: 100%;
            background: #fff;
            border: 1px solid #bc6c25;
            padding: 6px;
            font-family: 'Courier Prime', monospace;
            font-size: 0.85rem;
            margin-bottom: 8px;
            box-sizing: border-box;
            border-radius: 2px;
        }
        .campo-textarea {
            resize: vertical;
            height: 60px;
        }
        .preview-foto {
            max-width: 100%;
            height: 100px;
            object-fit: cover;
            border: 1px solid #4a2e18;
            display: block;
            margin-bottom: 8px;
            background: #ddd;
        }
        .acciones-aviso {
            display: flex;
            gap: 5px;
        }
        .btn {
            background: #5c3a21;
            color: #f4ebd0;
            border: none;
            padding: 6px 10px;
            font-family: 'Special Elite', cursive;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 3px;
            flex: 1;
            text-align: center;
        }
        .btn:hover {
            background: #7c4e31;
        }
        .btn-descargar {
            background: #bc6c25;
        }
        .btn-descargar:hover {
            background: #d4833b;
        }
        .pie-guia {
            text-align: center;
            border-top: 2px dashed #4a2e18;
            padding-top: 15px;
            margin-top: 25px;
            font-size: 0.75rem;
            color: #5c3a21;
        }
    </style>
</head>
<body>

    <div class="contenedor-guia">
        <div class="encabezado">
            <h1>BONUSCOM GUÍA</h1>
            <p>Módulo Oficial de 10 Espacios — Sello VentaniYA! Mar del Plata</p>
        </div>

        <div class="grilla-avisos" id="grillaAvisos">
            <!-- Los 10 avisos se generan dinámicamente -->
        </div>

        <div class="pie-guia">
            <strong>BonusCom Guía & VentaniYA! MDP 2026</strong><br>
            Sistema de Gestión Comercial en Tiempo Real
        </div>
    </div>

    <!-- Scripts de Firebase integrados de forma transparente -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAfTZmWdTnhQ_gkoSljDjFGWP7peYQQFC0",
            authDomain: "bonuscom3.firebaseapp.com",
            projectId: "bonuscom3",
            storageBucket: "bonuscom3.firebasestorage.app",
            messagingSenderId: "792157383470",
            appId: "1:792157383470:web:25327a470b6cb6bd17a8bf",
            measurementId: "G-TK15S1C2MK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const totalAvisos = 10;
        const contenedor = document.getElementById('grillaAvisos');

        // Generar estructura de las 10 tarjetas en pantalla
        for (let i = 1; i <= totalAvisos; i++) {
            contenedor.innerHTML += `
                <div class="tarjeta-aviso" id="tarjeta-${i}">
                    <h3>
                        <span>Casillero N° ${i < 10 ? '0' + i : i}</span>
                        <span id="hash-${i}" style="font-size:0.65rem; color:#7c4e31;">HASH: --------</span>
                    </h3>
                    <div class="meta-info-linea" id="meta-${i}" class="meta-aviso">Actualizado: --/--/---- --:-- hs</div>
                    
                    <input type="text" id="titulo-${i}" class="campo-input" placeholder="Título del Comercio / Aviso">
                    <textarea id="texto-${i}" class="campo-textarea" placeholder="Descripción y detalles..."></textarea>
                    
                    <input type="file" id="foto-file-${i}" class="campo-input" accept="image/*" onchange="cargarImagen(event, ${i})">
                    <input type="hidden" id="foto-url-${i}">
                    <img id="preview-${i}" class="preview-foto" src="" alt="Sin foto cargada" style="display:none;">

                    <div class="acciones-aviso">
                        <button class="btn" onclick="guardarAviso(${i})">💾 Guardar</button>
                        <button class="btn btn-descargar" onclick="descargarAviso(${i})">📥 Descargar</button>
                    </div>
                </div>
            `;
        }

        // Cargar imagen en base64 para guardarla directo
        window.cargarImagen = function(event, id) {
            const archivo = event.target.files[0];
            if (archivo) {
                const lector = new FileReader();
                lector.onload = function(e) {
                    document.getElementById(`foto-url-${id}`).value = e.target.result;
                    const imgPreview = document.getElementById(`preview-${id}`);
                    imgPreview.src = e.target.result;
                    imgPreview.style.display = 'block';
                };
                lector.readAsDataURL(archivo);
            }
        };

        // Guardar en la base de datos con hash y fechado 24hs
        window.guardarAviso = function(id) {
            const titulo = document.getElementById(`titulo-${id}`).value;
            const texto = document.getElementById(`texto-${id}`).value;
            const fotoUrl = document.getElementById(`foto-url-${id}`).value;
            
            const ahora = new Date();
            const fechado = ahora.toLocaleDateString('es-AR') + ' ' + ahora.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
            const hashId = 'MK-' + Math.random().toString(36).substring(2, 8).toUpperCase();

            const avisoRef = ref(db, 'bonuscom_guia/aviso_' + id);
            set(avisoRef, {
                titulo,
                texto,
                fotoUrl,
                fechado,
                hashId
            }).then(() => {
                alert('¡Aviso guardado con éxito en Bonuscom Guía!');
            }).catch((error) => {
                alert('Error al guardar: ' + error.message);
            });
        };

        // Descargar el aviso individualmente como ficha o texto
        window.descargarAviso = function(id) {
            const titulo = document.getElementById(`titulo-${id}`).value || 'Sin Título';
            const texto = document.getElementById(`texto-${id}`).value || 'Sin Texto';
            const hash = document.getElementById(`hash-${id}`).innerText;
            const fecha = document.getElementById(`meta-${id}`).innerText;

            const contenido = `=== BONUSCOM GUÍA - VENTANIYA MDP ===\nCasillero N° ${id}\n${hash}\n${fecha}\n\nTÍTULO: ${titulo}\n\nDETALLE:\n${texto}\n\n=====================================`;
            const blob = new Blob([contenido], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bonuscom-guia-aviso-${id}.txt`;
            a.click();
        };

        // Escuchar cambios en tiempo real desde la base de datos
        const guiaRef = ref(db, 'bonuscom_guia');
        onValue(guiaRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                for (let i = 1; i <= totalAvisos; i++) {
                    const item = data['aviso_' + i];
                    if (item) {
                        document.getElementById(`titulo-${i}`).value = item.titulo || '';
                        document.getElementById(`texto-${i}`).value = item.texto || '';
                        document.getElementById(`hash-${i}`).innerText = 'HASH: ' + (item.hashId || '--------');
                        document.getElementById(`meta-${i}`).innerText = 'Actualizado: ' + (item.fechado || '--/--/---- --:--');
                        
                        if (item.fotoUrl) {
                            document.getElementById(`foto-url-${i}`).value = item.fotoUrl;
                            const imgPreview = document.getElementById(`preview-${i}`);
                            imgPreview.src = item.fotoUrl;
                            imgPreview.style.display = 'block';
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
